[workspace]
resolver = "3"
members = ["crates/verse-ls", "crates/verse-ls-db", "crates/verse-ls-parser"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tower-lsp-server = "0.23"
